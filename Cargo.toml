[package]
name = "open-harness"
version = "0.1.0"
edition = "2021"
description = "Cross-harness capability platform: define a capability once (hook / skill / rule / command / tool / permission / agent / instructions), compile it to every AI coding agent's native config"
license = "MIT"
repository = "https://github.com/danplischke/open-harness"
default-run = "oh"

[[bin]]
name = "oh"
path = "src/main.rs"

# uniffi binding generator — only built with `--features ffi`.
[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["ffi"]

[lib]
name = "open_harness"
path = "src/lib.rs"
# cdylib for the language bindings; lib keeps the rlib for the CLI + tests.
crate-type = ["lib", "cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uniffi = { version = "0.28", features = ["cli"], optional = true }
# Trust & signing (#17): real ed25519 signatures over a sha256 content digest.
# Core (not feature-gated): integrity verification must always be available.
ed25519-dalek = "2"
sha2 = "0.10"
getrandom = "0.2"
# Optional TLS for the MCP bridge (#25) — only compiled with `mcp-http-tls`.
# `ring` provider (no cmake/build tooling) + Mozilla roots, both pure-Rust.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
webpki-roots = { version = "0.26", optional = true }

[features]
# Opt-in FFI surface (uniffi). Off by default so the core build stays lean.
ffi = ["dep:uniffi"]
# Opt-in TLS for the streamable-HTTP MCP bridge (#25). Off by default so the
# default build + the language bindings stay dependency-free; without it the
# bridge speaks http:// and honestly refuses https.
mcp-http-tls = ["dep:rustls", "dep:webpki-roots"]

[profile.dev]
opt-level = 0
