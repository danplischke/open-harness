name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # The cross-platform gate: the language-agnostic stdio contract must run the
  # real Python and Node capabilities on Windows, macOS, and Linux (#4). No
  # shebang reliance — the runtime resolves interpreters per-OS.
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build
        run: cargo build --verbose
      - name: Test
        run: cargo test --verbose

  # Formatting + lint run once, on Linux.
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: rustfmt
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

  # Docs (#18): the support matrix must be generated from the adapters (drift
  # gate), and the mdBook site must build.
  docs:
    name: docs + matrix gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Regenerate the support matrix and check for drift
        run: |
          bash docs/gen-matrix.sh
          git diff --exit-code docs/src/harness-matrix.md \
            || (echo "::error::docs/src/harness-matrix.md is stale — run docs/gen-matrix.sh" && exit 1)
      - name: Install mdBook
        uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: latest
      - name: Build the docs site
        run: mdbook build docs

  # Node addon (#14): build the napi native module and run the TS/JS example.
  # This proves the binding end-to-end; the cross-platform prebuilt-binary matrix
  # and npm publish are the remaining release-engineering piece.
  node-addon:
    name: node addon
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Set up Python (for the dispatched capabilities)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build addon + run example
        working-directory: bindings/node
        run: bash build.sh

  # The end-to-end lifecycle must actually run: author → sign & trust → compose a
  # profile → sync into a project → dispatch across harnesses → bridge + matrix.
  # This exercises the whole `oh` surface (incl. `check --profile`) with the real
  # Python + Node capabilities, and guards the demo from bit-rot.
  walkthrough:
    name: e2e walkthrough
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Set up Python (secret-guard)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node (audit-note + typed TS hook)
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build the oh CLI
        run: cargo build --bin oh
      - name: Run the end-to-end walkthrough
        run: bash examples/walkthrough.sh

  # The optional TLS feature for the MCP bridge (#25) must build, lint, and test
  # clean — it is off by default, so it needs its own job to stay green.
  tls-feature:
    name: mcp-http-tls feature
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: clippy (mcp-http-tls)
        run: cargo clippy --features mcp-http-tls --all-targets -- -D warnings
      - name: test (mcp-http-tls)
        run: cargo test --features mcp-http-tls
