[package]
name = "open-harness"
version = "0.1.0"
edition = "2021"
description = "Cross-harness capability platform: define a capability once (hook / skill / rule / command / tool / permission / agent / instructions), compile it to every AI coding agent's native config"
license = "MIT"
repository = "https://github.com/danplischke/open-harness"
default-run = "oh"

[[bin]]
name = "oh"
path = "src/main.rs"

# uniffi binding generator — only built with `--features ffi`.
[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["ffi"]

[lib]
name = "open_harness"
path = "src/lib.rs"
# cdylib for the language bindings; lib keeps the rlib for the CLI + tests.
crate-type = ["lib", "cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
# `preserve_order` keeps `Map` insertion-ordered (IndexMap) instead of sorting.
# Config files are read into a `Value` before deserializing, and the YAML writer
# emits from one, so without it every emitted mapping would be alphabetized and
# an author's key order would not survive a round-trip.
serde_json = { version = "1", features = ["preserve_order"] }
uniffi = { version = "0.28", features = ["cli"], optional = true }
# Trust & signing (#17): real ed25519 signatures over a sha256 content digest.
# Core (not feature-gated): integrity verification must always be available.
ed25519-dalek = "2"
sha2 = "0.10"
getrandom = "0.2"
# YAML frontmatter for single-file capabilities. A real, pure-Rust YAML 1.2
# parser — we hand-roll the *simple* wire formats (JSON-RPC, HTTP, hex), but YAML
# is a complex spec and correctness (quotes, nesting, anchors) is what a library
# is for. Reading only; we emit our own frontmatter.
yaml-rust2 = "0.10"
# `select` patterns. Pure-Rust, no dependencies of its own. `Pattern` is used
# for string matching only — nothing here touches the filesystem — and it buys
# character classes and malformed-pattern errors over a hand-rolled matcher.
glob = "0.3"
# Optional TLS for https:// (#25) — only compiled with `http-tls`.
# `ring` provider (no cmake/build tooling) + Mozilla roots, both pure-Rust.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
webpki-roots = { version = "0.26", optional = true }

[features]
# Opt-in FFI surface (uniffi). Off by default so the core build stays lean.
ffi = ["dep:uniffi"]
# Opt-in TLS for `https://` — used by the streamable-HTTP MCP bridge (#25) and
# by remote capability sources (a registry index served over HTTPS). Off by
# default so the default build + the language bindings stay dependency-free;
# without it those callers honestly refuse https instead of downgrading.
http-tls = ["dep:rustls", "dep:webpki-roots"]
# Compatibility alias for the name this feature had while the transport lived
# only in the MCP bridge.
mcp-http-tls = ["http-tls"]

[profile.dev]
opt-level = 0
